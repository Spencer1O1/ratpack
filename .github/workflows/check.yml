name: Check

"on":
  push:
    branches: ['**']
  pull_request:
    branches: [devel, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/check.py
      - run: python3 -m unittest discover -s tests -v
